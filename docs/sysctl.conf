# /etc/sysctl.d/99-ssd-delalloc-optimized.conf
#
# 3.x kernel optimization backport for SSD + delalloc
# Combined with writeback batch size limit (1024 pages) in ext4.ko
#
# These aggressive parameters are designed for:
# - Linux 2.6.39 kernel
# - ext4 filesystem with delalloc
# - SSD storage
# - Multi-process concurrent I/O scenarios
#
# DO NOT use these values on HDD systems!

# Hard limit: maximum dirty pages (2% of RAM)
# Default: 20
# Effect: Prevents large batches of dirty pages accumulation
vm.dirty_ratio = 2

# Soft limit: background writeback threshold (1% of RAM)
# Default: 10
# Effect: Triggers background writeback earlier
vm.dirty_background_ratio = 1

# Background writeback interval (30 centiseconds = 0.3 seconds)
# Default: 500 (5 seconds)
# Effect: More frequent writeback checks
vm.dirty_writeback_centisecs = 30

# Dirty page expiration time (300 centiseconds = 3 seconds)
# Default: 3000 (30 seconds)
# Effect: Forces dirty pages to be written after 3 seconds
vm.dirty_expire_centisecs = 300
